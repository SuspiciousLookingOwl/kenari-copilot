name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          New version (e.g. 0.2.3). If omitted, only builds without
          version sync.
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run postinstall script (copy tokenizer)
        run: node scripts/copy-tokenizer.js

      # Resolve the version source: manual input > tag > none
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "ver=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            echo "ver=${VER}" >> $GITHUB_OUTPUT
          else
            echo "ver=" >> $GITHUB_OUTPUT
          fi

      # Only sync and push when a version was resolved
      - name: Sync and commit version
        if: steps.ver.outputs.ver != ''
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          echo "Syncing package.json version to ${VER}"
          npm version "$VER" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          MSG="chore: bump version to ${VER} [skip ci]"
          git diff --cached --quiet || git commit -m "$MSG"
          # Prefer pushing the branch that contains the triggering commit.
          BRANCH=$(git branch -r --contains "$GITHUB_SHA" \
            | sed 's|.*origin/||' | grep -x 'master' | head -1)
          if [ -z "$BRANCH" ]; then
            BRANCH=$(git branch -r --contains "$GITHUB_SHA" \
              | head -1 | sed 's|.*origin/||' | xargs)
          fi
          if [ -n "$BRANCH" ]; then
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            echo "No remote branch found, skipping push."
          fi

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension (.vsix)
        run: npx @vscode/vsce package -o extension.vsix

      - name: Get version from package.json
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Get tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # Create a draft Release on tag push
      - name: Create draft Release (tag push)
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: false
          files: extension.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A published Release only gets the .vsix, its description is left alone
      - name: Upload .vsix to published Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: extension.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the .vsix as a workflow artifact (fallback)
      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenari-copilot-provider-${{ steps.version.outputs.version }}.vsix
          path: extension.vsix
          if-no-files-found: error

      # Publish to the VS Code Marketplace
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx @vscode/vsce publish -p "$VSCE_PAT" \
            --packagePath extension.vsix --allow-all-proposed-apis
